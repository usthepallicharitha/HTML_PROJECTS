<!DOCTYPE html>
<html>
<head>
<title>Light UI Calculator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#e3f2fd,#fce4ec);
}

/* Calculator */

.calculator{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* Display */

#display{
width:100%;
height:70px;
border:none;
border-radius:12px;
margin-bottom:20px;
font-size:28px;
text-align:right;
padding:10px;
background:#f5f5f5;
outline:none;
}

/* Buttons grid */

.buttons{
display:grid;
grid-template-columns:repeat(5,65px);
gap:10px;
}

/* Buttons */

button{
height:55px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:#f0f0f0;
transition:0.2s;
}

button:hover{
background:#dfe6e9;
transform:scale(1.05);
}

/* Operator */

.operator{
background:#74b9ff;
color:white;
}

/* Equal */

.equal{
background:#ff7675;
color:white;
grid-column:span 2;
}

/* Clear */

.clear{
background:#fab1a0;
color:white;
}

/* Function buttons */

.func{
background:#55efc4;
}

</style>
</head>

<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button class="func" onclick="square()">x²</button>
<button class="func" onclick="sqrt()">√</button>
<button class="func" onclick="percent()">%</button>
<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="backspace()">⌫</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('/')">÷</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>

<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<script>

function add(value){
document.getElementById("display").value += value;
}

function clearDisplay(){
document.getElementById("display").value="";
}

function backspace(){
let d=document.getElementById("display");
d.value=d.value.slice(0,-1);
}

function calculate(){
let exp=document.getElementById("display").value;
document.getElementById("display").value=eval(exp);
}

function square(){
let d=document.getElementById("display");
d.value=d.value*d.value;
}

function sqrt(){
let d=document.getElementById("display");
d.value=Math.sqrt(d.value);
}

function percent(){
let d=document.getElementById("display");
d.value=d.value/100;
}

</script>

</body>
</html>
